name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Pin chezmoi to reduce CI drift; update when bumping (see AGENTS.md Known Hardcoded Values)
  CHEZMOI_VERSION: v2.63.1

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install chezmoi ${{ env.CHEZMOI_VERSION }}
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/bin" "${{ env.CHEZMOI_VERSION }}"
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Run audit
        shell: pwsh
        run: .\audit.ps1
