name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Pin chezmoi to reduce CI drift; update when bumping (see AGENTS.md Known Hardcoded Values)
  CHEZMOI_VERSION: "2.70.4"

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install chezmoi ${{ env.CHEZMOI_VERSION }}
        run: |
          mkdir -p "$HOME/bin"
          curl -fsL "https://github.com/twpayne/chezmoi/releases/download/v${{ env.CHEZMOI_VERSION }}/chezmoi_${{ env.CHEZMOI_VERSION }}_linux_amd64.tar.gz" | \
            tar -xzf - -C "$HOME/bin" chezmoi
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Run audit
        shell: pwsh
        run: .\audit.ps1
