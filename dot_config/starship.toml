"$schema" = 'https://starship.rs/config-schema.json'

# Nerd Font Symbols preset applied: https://starship.rs/presets/nerd-font

# 每個 prompt 之間插入空行
add_newline = true

# Prompt 格式：兩行式，第一行資訊，第二行輸入
format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$dotnet\
$rust\
$golang\
$cmd_duration\
$line_break\
$character"""

# ------------------------------------------------------------
# OS 圖示
# ------------------------------------------------------------
[os]
disabled = false
style = "bold blue"

[os.symbols]
AIX           = " "
AlmaLinux     = " "
Alpaquita     = " "
Alpine        = " "
ALTLinux      = " "
Amazon        = " "
Android       = " "
AOSC          = " "
Arch          = " "
Artix         = " "
Bluefin       = " "
CachyOS       = " "
CentOS        = " "
Debian        = " "
DragonFly     = " "
Elementary    = " "
Emscripten    = " "
EndeavourOS   = " "
Fedora        = " "
FreeBSD       = " "
Garuda        = " "
Gentoo        = " "
HardenedBSD   = "󰞌 "
Illumos       = " "
InstantOS     = " "
Ios           = "󰀷 "
Kali          = " "
Linux         = " "
Mabox         = " "
Macos         = " "
Manjaro       = " "
Mariner       = " "
MidnightBSD   = " "
Mint          = " "
NetBSD        = " "
NixOS         = " "
Nobara        = " "
OpenBSD       = " "
OpenCloudOS   = " "
openEuler     = " "
openSUSE      = " "
OracleLinux   = "󰺡 "
PikaOS        = " "
Pop           = " "
Raspbian      = " "
Redhat        = "󱄛 "
RedHatEnterprise = "󱄛 "
Redox         = "󰀘 "
RockyLinux    = " "
Solus         = " "
SUSE          = " "
Ubuntu        = " "
Ultramarine   = " "
Unknown       = " "
Uos           = " "
Void          = " "
Windows       = "󰍲 "
Zorin         = " "

# ------------------------------------------------------------
# 使用者 / 主機（SSH 時才顯示）
# ------------------------------------------------------------
[username]
show_always = false
style_user  = "bold yellow"
style_root  = "bold red"
format      = "[$user]($style) "

[hostname]
ssh_only = true
style    = "bold dimmed green"
format   = "[@$hostname]($style) "

# ------------------------------------------------------------
# 目錄
# ------------------------------------------------------------
[directory]
style              = "bold cyan"
truncation_length  = 4
truncate_to_repo   = true
format             = "[ $path]($style)[$read_only]($read_only_style) "
read_only          = " 󰌾"

# ------------------------------------------------------------
# Git
# ------------------------------------------------------------
[git_branch]
symbol = " "
style  = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
style    = "bold red"
format   = '([$all_status$ahead_behind]($style) )'
ahead    = "⇡${count}"
behind   = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
staged   = "[+${count}](bold green) "
modified = "[~${count}](bold yellow) "
deleted  = "[-${count}](bold red) "
untracked = "[?${count}](bold dimmed) "
conflicted = "[=${count}](bold red) "

# ------------------------------------------------------------
# 語言版本（有相關檔案才顯示）
# ------------------------------------------------------------
[nodejs]
symbol = " "
style  = "bold green"
format = "[$symbol$version]($style) "

[python]
symbol = " "
style  = "bold yellow"
format = "[${symbol}${pyenv_prefix}${version}( \\($virtualenv\\))]($style) "

[dotnet]
symbol = " "
style  = "bold blue"
format = "[$symbol$version( 󰓾 $tfm)]($style) "

[rust]
symbol = "󱘗 "
style  = "bold red"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style  = "bold cyan"
format = "[$symbol$version]($style) "

# ------------------------------------------------------------
# 指令執行時間（超過 2 秒才顯示）
# ------------------------------------------------------------
[cmd_duration]
min_time           = 2_000
style              = "bold yellow"
format             = "[ $duration]($style) "

# ------------------------------------------------------------
# 輸入提示符
# ------------------------------------------------------------
[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"
vimcmd_symbol  = "[❮](bold green)"
